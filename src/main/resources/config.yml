# Do not touch this setting!
config-version: 3

# TPA request settings
tpa:
  request-timeout-seconds: 30
  # Whether movement cancels a TPA teleport countdown (independent of teleport.cancel-on-move)
  cancel-on-move: false

# The default Waylith limit for all players
# Set to 0 to disable Wayliths for non-admins
# Can be overridden by permission nodes: wayliths.limit.<amount>
default-waylith-limit: 1

# Teleport timing for Wayliths and scrolls (seconds)
teleport:
  # Global cooldown for all teleporting
  cooldown-seconds: 0
  cooldown-display: actionbar # Options: chat, actionbar
  # Customize countdowns independently for each teleport item
  items:
    bed-scroll:
      countdown-seconds: 3
    waylith-scroll:
      countdown-seconds: 3
    tpa-scroll:
      countdown-seconds: 3
    waylith-block:
      countdown-seconds: 3
  countdown-display: actionbar # Options: chat, actionbar
  countdown-sound-enabled: true
  sound: entity.enderman.teleport # Sound event key, e.g. entity.enderman.teleport
  particles:
    enabled: true
    type: PORTAL # Bukkit Particle enum name
    count: 30
  cancel-on-move: true

# Controls the particles that spawn around the Waylith
# Use https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Particle.html
particles:
  enabled: true
  type: "PORTAL"
  count: 5

# Brief effects played when a Waylith is placed or broken
waylith-effects:
  beacon-beam-enabled: true
  beacon-beam-particle: END_ROD # Options: END_ROD, PURPLE_DUST
  placement-sound-enabled: true
  placement-sound: block.beacon.activate # Sound event key, e.g. entity.experience_orb.pickup
  break-sound-enabled: true
  break-sound: block.beacon.deactivate # Sound event key, e.g. block.anvil.land

# Determines what items are used in the plugin
items:
  waylith-block:
    enabled: true
    glowing: false
    type: "Minecraft" # Choice: Minecraft, Nexo
    id: "LODESTONE"   # Material name (e.g. LODESTONE) or Nexo block ID
  waylith-scroll:
    enabled: true
    glowing: true
    type: "Minecraft" # Choice: Minecraft, Nexo
    id: "PAPER"        # Material name (e.g. PAPER) or Nexo item ID
  bed-scroll:
    enabled: true
    glowing: true
    type: "Minecraft" # Choice: Minecraft, Nexo
    id: "PAPER"        # Material name (e.g. PAPER) or Nexo item ID
  tpa-scroll:
    enabled: true
    glowing: true
    type: "Minecraft" # Choice: Minecraft, Nexo
    id: "PAPER"        # Material name (e.g. PAPER) or Nexo item ID

# Turns on debugging in console
debug: false