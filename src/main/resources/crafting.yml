# Do not touch this setting!
crafting-version: 1

# Master switch to turn all built-in Waylith crafting on or off.
# Set to false if you use external plugin methods (like CustomCrafting, ItemsAdder, etc.)
enabled: true

# Define your custom recipes here.
# Note on Ingredients:
# - Using 'WOOL' as an ingredient will automatically accept any color variant (White, Red, Blue, etc.).
# - You can also specify an exact material name (e.g., 'WHITE_WOOL') if you want to restrict it to a specific color.

recipes:
  waylith_block:
    type: shaped
    result-amount: 1
    shape:
      - "SSS"
      - "SES"
      - "SLS"
    ingredients:
      S: STONE
      E: ENDER_PEARL
      L: LODESTONE

  waylith_scroll:
    type: shaped
    result-amount: 8
    shape:
      - "PPP"
      - "PEP"
      - "PSP"
    ingredients:
      P: PAPER
      E: ENDER_PEARL
      S: STRING

  bed_scroll:
    type: shaped
    result-amount: 8
    shape:
      - "PWP"
      - "PEP"
      - "PSP"
    ingredients:
      P: PAPER
      E: ENDER_PEARL
      W: WOOL      # Accepts any colored wool, or specify 'WHITE_WOOL' for exact color
      S: STRING

  tpa_scroll:
    type: shaped
    result-amount: 8
    shape:
      - "PSP"
      - "PEP"
      - "PSP"
    ingredients:
      P: PAPER
      E: ENDER_PEARL
      S: STRING